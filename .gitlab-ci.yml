stages:
  - validate
  - plan
  - apply
  - destroy
 
image: 
  name: hashicorp/terraform:latest
  entrypoint: ["sh", "-c"]

before_script:
  - apk add --no-cache aws-cli
  - echo "Vérification des credentials AWS"
  - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
  - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
  - aws configure set region "$AWS_DEFAULT_REGION"
  - echo "Initialisation de Terraform..."
  - terraform init

validate:
  stage: validate
  tags:
  - fedora
  - local-runner

  script:
    - echo "Validation Terraform..."
    - terraform validate

plan:
  stage: plan
  tags:
  - fedora
  - local-runner

  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - tfplan
  when: manual
  only:
    - livrables

apply:
  stage: apply
  tags:
  - fedora
  - local-runner
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  when: manual  
  only:
    - livrables

apply_modules:
  stage: apply
  tags:
  - fedora
  - local-runner

  script:
    - terraform apply -target=module.rds -auto-approve
    - terraform apply -target=module.ingress -auto-approve

  dependencies:
    - plan
  when: manual  
  only:
    - livrables    

destroy:
  stage: destroy
  tags:
  - fedora
  - local-runner

  script:
    - terraform destroy -auto-approve
  when: manual
  only:
    - livrables


  
rm-state:
  stage: destroy
  tags:
  - fedora
  - local-runner

  script:
    - terraform state rm module.ingress.helm_release.nginx_ingress
    - terraform state rm module.rds.kubernetes_namespace.eshop
  when: manual
  only:
    - livrables
    
